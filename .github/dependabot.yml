# Dependabot keeps the GitHub Actions in CI, the Python deps, and the dev-only npm
# deps current. Updates are grouped so each ecosystem opens one batched PR per week
# instead of a separate PR per package.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
  # The only npm surface is dev-only test tooling: package.json at the repo root
  # exists solely so CI and local dev can install @playwright/test for the e2e smoke
  # suite, plus @axe-core/playwright for the A1 accessibility scan (axe is injected
  # into the page by the test, never shipped). The app itself is buildless and ships
  # no npm packages, so this entry stays small (one grouped weekly PR), same shape as
  # the others. Note that an axe-core bump can legitimately turn a green scan red by
  # adding a rule: that is the tool working, and the fix is the markup, not a pin.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns: ["*"]

name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Matches the runtime pinned in nixpacks.toml.
          python-version: "3.12"
      # requirements-dev chains to requirements.lock, so the versions pytest
      # runs against here are exactly what Railway deploys.
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check .
        working-directory: backend
      - run: ruff format --check .
        working-directory: backend
      # Type-checks the application modules per backend/mypy.ini.
      - run: mypy
        working-directory: backend
      - run: pytest
        working-directory: backend

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The runner's preinstalled Node is plenty for node --test.
      - run: node --test "frontend/*.test.js"

  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      # Dev-only deps for the Playwright smoke suite (the app itself is buildless);
      # npm ci installs the exact @playwright/test and @axe-core/playwright pinned in
      # package-lock.json. Nothing new to run: the config's testDir picks up
      # a11y.spec.js with the rest, so the accessibility scan is already gated here.
      - run: npm ci
      # Chromium only, matching the single-browser smoke config; --with-deps pulls
      # the system libraries the headless browser needs on the runner.
      - run: npx playwright install chromium --with-deps
      # Hermetic: page.route intercepts every /api/* and the two unpkg Leaflet URLs,
      # and the config's webServer serves frontend/, so this needs no network or
      # Python backend at test time.
      - run: npx playwright test --config tests/e2e/playwright.config.js

  # The contract tier (C6): the REAL backend polling a simulator the tests drive.
  # Two jobs rather than one, and separate from the three above, because this tier
  # is the slow one by construction and a failure here means something different:
  # not "a unit broke" but "the composite lies". Keeping it out of backend-tests
  # also keeps `cd backend && pytest` the fast inner loop it has always been.
  # See tests/contract/README.md.
  contract-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      # This suite lives outside backend/, so backend-tests' lint step does not
      # reach it; same config, so the two stay stylistically identical.
      - run: ruff check --config backend/ruff.toml tests/contract
      - run: ruff format --check --config backend/ruff.toml tests/contract
      # From the repo root: this directory is collected only when named, so the
      # hermetic backend suite above never picks it up.
      - run: pytest tests/contract

  contract-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      # Both runtimes: the config's webServer launches the simulator and the real
      # uvicorn app, and the specs drive the simulator over its control endpoint.
      - run: pip install -r backend/requirements-dev.txt
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test --config tests/contract/playwright.contract.config.js
      # Zero retries here (see the config), so a failure leaves exactly one trace.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: contract-e2e-traces
          path: test-results/
          retention-days: 7

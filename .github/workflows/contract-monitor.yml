name: Contract monitor

# Scheduled liveness check against the REAL upstream feeds and the production
# deployment, using the production decoders (see backend/scripts/contract_monitor.py).
# This is deliberately SEPARATE from ci.yml and is never a gate on it: CI stays
# hermetic (goldens pin decode behavior against captured bytes), and this job is
# the other half that notices when live reality drifts out from under those
# goldens. It runs on a schedule and on demand only, never on push or
# pull_request, so it can never block a merge.
#
# Alerting is the run status itself: the script exits non-zero when any check
# FAILs, which fails this workflow, and GitHub's own scheduled-workflow-failure
# notifications reach the repo admins. WARNs never fail the run (they surface in
# the logs and the job summary). There is deliberately no issue-creation or other
# automation here.

on:
  schedule:
    # Every 6 hours. Frequent enough to catch a drift within a quarter day, rare
    # enough that a courteous single fetch per source is a negligible load on the
    # community-hosted feeds (PATH bridge, NYC Ferry Connexionz).
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

# A single scheduled monitor should never pile up: if a run is somehow still
# going when the next fires, skip rather than stack.
concurrency:
  group: contract-monitor
  cancel-in-progress: false

# Read-only: the monitor only fetches and reports. It needs no write access to
# the repo, so it is granted none.
permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    # REQUIRED FOR THE NJ TRANSIT CREDENTIALS TO EXIST AT ALL (15a). NJT_USERNAME
    # and NJT_PASSWORD are ENVIRONMENT secrets on an environment named "monitor",
    # not repository secrets. Environment secrets resolve only for a job that
    # declares the environment, so without this line the two `secrets.NJT_*`
    # mappings below are silently empty strings and the njt-static check
    # WARN-skips forever while looking exactly like a deliberate opt-out. The
    # declaration is the whole mechanism; there is nothing else to configure.
    #
    # THE ENVIRONMENT IS DEPLOYMENT-BRANCH-RESTRICTED TO main, and the resulting
    # degradation is by design rather than by accident: a context that is not
    # permitted to reach the environment does not get the credentials, and the
    # check's credentials-absent path is a WARN-skip that says exactly which two
    # names are missing. So a fork, a pull request context, or any run off a
    # non-main ref reports NJT as skipped instead of failing or, worse, silently
    # checking nothing. The scheduled runs this workflow exists for always fire on
    # the default branch, so they are always on the permitted side of that line.
    #
    # ONE PRACTICAL NOTE for whoever debugs a red manual dispatch: a deployment
    # branch policy gates the JOB, so a `workflow_dispatch` deliberately launched
    # from a non-main ref is refused by Actions before any step runs, rather than
    # running credential-free. The WARN-skip above is what a context with no
    # access to the environment sees; a blocked job is what a restricted ref sees.
    # Both are safe, and neither can quietly check the real upstream without
    # credentials.
    environment: monitor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Matches the runtime pinned in nixpacks.toml and ci.yml, so the monitor
          # decodes with the same Python the deployment runs.
          python-version: "3.12"
      # requirements.lock is the exact pinned runtime set Railway deploys, so the
      # monitor exercises the same decoder library versions as production. No dev
      # deps: this job runs the script, not the test suite.
      - run: pip install -r backend/requirements.lock
      - name: Run contract monitor
        working-directory: backend
        env:
          # Repository variable holding the deployment base URL, or the full
          # /api/status URL (both forms accepted). REQUIRED: when unset, the
          # production section FAILs and the run exits 1, because an unmonitored
          # deployment must not be able to look the same as a healthy one.
          MONITOR_STATUS_URL: ${{ vars.MONITOR_STATUS_URL }}
          # The deliberate opt-out for a fork or a run with no deployment: any
          # non-empty value turns the section into an explicit WARN instead. This
          # mapping is REQUIRED for the opt-out to work at all. Actions does not
          # export repository variables into the process environment; only the names
          # listed in this block reach it, so without this line the variable the
          # README documents (and the FAIL message itself recommends) would be inert
          # and the FAIL would be inescapable in CI.
          MONITOR_SKIP_PRODUCTION: ${{ vars.MONITOR_SKIP_PRODUCTION }}
          # Optional secret for the keyed bus feed. When unset, the bus check
          # WARN-skips (it cannot reach the feed without a key).
          MTA_BUS_API_KEY: ${{ secrets.MTA_BUS_API_KEY }}
          # NJ Transit's credentialed RailData API (15a). These are ENVIRONMENT
          # secrets on the "monitor" environment declared at the job level above,
          # NOT repository secrets, so this mapping is inert without that
          # declaration. When either resolves empty the njt-static check
          # WARN-skips, exactly like the bus check above: the monitor cannot reach
          # a credentialed feed without credentials, and that is a configuration
          # state rather than an outage.
          #
          # THE MONITOR MINTS EXACTLY ONCE PER RUN when they are set (see
          # check_njt_static). At the 6-hourly cadence above that is four mints a
          # day against a rate limit NJ Transit does not publish, which is why the
          # single-mint discipline is enforced in the check rather than left to
          # the retry helper.
          NJT_USERNAME: ${{ secrets.NJT_USERNAME }}
          NJT_PASSWORD: ${{ secrets.NJT_PASSWORD }}
        run: python scripts/contract_monitor.py

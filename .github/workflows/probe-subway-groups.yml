name: Probe subway groups

# TEMPORARY. Step 0 of Amendment 1 to the freshness contract (docs/design/freshness-contract.md,
# A1.6, and its Q1): keyless samples of the eight subway group feeds over a full service day,
# the overnight included, so the route-to-group table Step 2 writes beside SUBWAY_FEED_URLS
# cites a committed capture rather than a document's grouping. backend/scripts/
# probe_subway_groups.py takes the samples; each run uploads one file as one artifact named by
# its UTC time.
#
# WHAT REMOVES IT: the follow-up branch that downloads every artifact, folds them with
# `probe_subway_groups.py --reduce`, and commits the reduced capture under
# backend/tests/fixtures/ deletes this file in that same commit, with the workflow section of
# backend/tests/test_probe_subway_groups.py. Nothing else depends on it, and it is never a gate.
#
# JUDGED BY COVERAGE, NOT DURATION. GitHub's schedule drifts and drops runs: this repository's
# contract monitor (cron "17 */6 * * *") ran 231 to 362 minutes late on 2026-11-01/02 by its
# run times against its slots, and this workflow's own first scheduled run came 4h54m after
# the merge that added it, the only one in that time. So the schedule stays, and nothing
# relies on it: a DISPATCHED run takes a loop, a sample every ten minutes for loop_minutes
# (default 340), all into one file named for the loop's start, uploaded as
# subway-groups-loop-<start>. A scheduled run still takes one sample, uploaded as
# subway-groups-<time>. Every row records which (provenance: scheduled or dispatched), and
# the capture counts samples by it. The collection runs until the reduction's coverage table
# shows every hour of the day sampled across one weekday service day and its overnight (its
# weekday_windows_fully_covered), however long that takes.
#
# THE TIMEOUTS NEST, and the order is the point. A loop of 340 minutes starts its last sample
# before minute 340 and is done within seconds of it; the sample step is killed at 350 if it
# is not; the job at 358, under GitHub's 360-minute ceiling for a hosted runner. The naming
# and upload steps run always(), so a loop the step timeout kills still uploads every sample
# it finished (each is written and closed as it completes).
#
# THE NETWORK AND NJ TRANSIT. The job fetches the eight URLs in SUBWAY_FEED_URLS, once per
# sample, with no key. It maps no secret and declares no environment, so the NJ Transit
# credentials (environment secrets on "monitor", see contract-monitor.yml) cannot exist here,
# and nothing in this workflow can spend a mint. A test pins that.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: "Minutes of samples, one every ten minutes, into one artifact (at most 340)"
        type: number
        required: true
        default: 340

# One group per trigger, and within each, late runs queue rather than drop. A dispatched loop
# runs for hours and a scheduled sample for seconds, so they do not share a group: a sample
# waiting behind a loop would run hours late, and a hundred of them would run back to back.
# Two loops never run at once; a second waits for the first (cancel-in-progress false keeps
# the running one, and queue: max keeps every waiting one, up to GitHub's 100, first in first
# out, where the default, single, would let a newer arrival cancel the one already waiting).
# A scheduled sample and a loop may overlap, which costs nothing: each writes its own file
# and the reduction keys samples by their own time. GitHub may still drop a scheduled run
# under load, and a run that fails before its upload leaves no artifact: neither reaches the
# reduction as a row, so lost runs are counted from this workflow's run list, not from the
# capture, and the capture's coverage table shows whether they cost an hour.
concurrency:
  group: probe-subway-groups-${{ github.event_name }}
  cancel-in-progress: false
  queue: max

# Read-only: the job fetches public feeds and uploads an artifact, which needs no repository
# write. upload-artifact authenticates with the Actions runtime token, which this block does
# not govern, so contents: read is all GITHUB_TOKEN is given.
permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Matches the runtime pinned in nixpacks.toml, ci.yml and contract-monitor.yml.
          python-version: "3.12"
      # The exact pinned runtime set Railway deploys, so the feeds are parsed with the same
      # gtfs-realtime-bindings and protobuf versions as production. No dev deps.
      - run: pip install -r backend/requirements.lock
      - name: Take one sample (scheduled) or a loop of them (dispatched)
        working-directory: backend
        timeout-minutes: 350
        env:
          EVENT: ${{ github.event_name }}
          LOOP_MINUTES: ${{ inputs.loop_minutes }}
        # The script prints the file's path on stdout and each sample's tally on stderr, and
        # exits 0 whenever the file is written, failed feeds included: a failure is a row in
        # the sample, so it reaches the artifact rather than ending the run.
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            python scripts/probe_subway_groups.py --out-dir "$RUNNER_TEMP/samples" \
              --provenance dispatched --loop-minutes "$LOOP_MINUTES"
          else
            python scripts/probe_subway_groups.py --out-dir "$RUNNER_TEMP/samples" \
              --provenance scheduled
          fi
      - name: Name the artifact by the file's own UTC time
        id: sample
        if: always()
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -- "$RUNNER_TEMP"/samples/*.jsonl
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "expected exactly one sample file, found: $*" >&2
            exit 1
          fi
          if [ "$EVENT" = workflow_dispatch ]; then prefix=subway-groups-loop; else prefix=subway-groups; fi
          echo "path=$1" >> "$GITHUB_OUTPUT"
          echo "name=$prefix-$(basename "$1" .jsonl)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: always() && steps.sample.outputs.path != ''
        with:
          name: ${{ steps.sample.outputs.name }}
          path: ${{ steps.sample.outputs.path }}
          if-no-files-found: error
          # Long enough to outlive the collection and the follow-up branch that reduces it.
          # GitHub caps this at the repository's own retention setting.
          retention-days: 90
